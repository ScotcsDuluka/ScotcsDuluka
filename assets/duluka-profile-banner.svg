    <text x="160" y="60" fill="#C3D1CD" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="3" font-weight="700">DULUKA STUDIOS  /  INDEPENDENT BUILDER</text>
    <text x="52" y="177" fill="#F4F8F3" font-family="Segoe UI,Arial,sans-serif" font-size="77" letter-spacing="-2" font-weight="800">SCOTCS</text>
    <text x="52" y="260" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="86" letter-spacing="-3" font-weight="800">DULUKA</text>
    <text x="55" y="313" fill="#B6C8C2" font-family="Segoe UI,Arial,sans-serif" font-size="22" letter-spacing=".2">Build what you wish existed.</text>
