<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ScotcsDuluka — Duluka Studios</title>
  <desc id="desc">Dark editorial developer banner with lime and turquoise details, representing a one-person creative technology studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0A1011"/>
      <stop offset=".55" stop-color="#101B1B"/>
      <stop offset="1" stop-color="#071011"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#C5F765"/>
      <stop offset="1" stop-color="#47D7CE"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#49CCBA" stop-opacity=".22"/>
      <stop offset="1" stop-color="#49CCBA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B6D2CD" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="420" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
