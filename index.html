<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบคะแนน + 2 Event</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0; background: #f0f0f0; }
  #score { font-size: 2rem; margin-bottom: 20px; }
  img { width: 250px; height: 250px; object-fit: cover; cursor: pointer; border-radius: 15px; transition: transform 0.2s; z-index: 1; }
  img:active { transform: scale(0.95); }

  /* ปุ่มรีเซ็ต */
  #resetBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 8px 15px;
    background: crimson;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    z-index: 10;
  }

  /* กล่องยืนยัน */
  #confirmBox {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 10px;
    padding: 20px;
    display: none;
    z-index: 30;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  #confirmBox button {
    margin: 10px;
    padding: 8px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #yesBtn { background: green; color: white; }
  #noBtn { background: gray; color: white; }

  /* overlay มืดเทา */
  #overlay {
    position: fixed;
    top: 0; left: 0; 
    width: 100%; height: 100%;
    background: rgba(34,34,34,0.9); 
    opacity: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 2s ease;
    z-index: 20;
  }

  #overlay img {
    width: 300px;
    height: auto;
    margin-bottom: 20px;
  }

  #overlay p {
    color: red;
    font-size: 1.2rem;
    text-align: center;
    margin: 5px 0;
  }
</style>
</head>
<body>

<div id="score">คะแนน: 0</div>

<img id="myImage" src="https://limbuscompany.wiki.gg/images/Don_Quixote_Sprite_3.png?eafa96" alt="กดฉัน">

<audio id="clickSound" src="https://static.wikia.nocookie.net/limbuscompany/images/4/4c/LCB_Sinner_Don_Quixote_Stagger.wav/revision/latest?cb=20230603105543"></audio>

<button id="resetBtn">รีเซ็ต</button>

<!-- กล่องยืนยัน -->
<div id="confirmBox">
  <p id="confirmText">คุณแน่ใจหรือไม่?</p>
  <button id="yesBtn">ใช่</button>
  <button id="noBtn">ไม่</button>
</div>

<!-- Overlay Event -->
<div id="overlay">
  <img id="overlayImage" src="https://limbuscompany.wiki.gg/images/Don_Quixote_Bloodfiend_Silhouette_Eyes_StandingSprite.png?35661d" alt="Secret Event">
  <p id="overlayText1"></p>
  <p id="overlayText2"></p>
  <button id="consentBtn" style="display:none; padding:8px 15px; border:none; border-radius:8px; background:green; color:white; cursor:pointer;">ยินยอม</button>
</div>

<script>
let score = 0;
let pointsPerClick = 1; // ปกติ 1 ต่อครั้ง
let isLocked = false;
const scoreDisplay = document.getElementById('score');
const img = document.getElementById('myImage');
const sound = document.getElementById('clickSound');
const resetBtn = document.getElementById('resetBtn');
const confirmBox = document.getElementById('confirmBox');
const confirmText = document.getElementById('confirmText');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const overlay = document.getElementById('overlay');
const overlayImage = document.getElementById('overlayImage');
const overlayText1 = document.getElementById('overlayText1');
const overlayText2 = document.getElementById('overlayText2');
const consentBtn = document.getElementById('consentBtn');
let confirmAction = "";

// โหลดคะแนน
if(localStorage.getItem('score')){
  score = parseInt(localStorage.getItem('score'));
  updateUI();
}

// อัปเดต UI
function updateUI(){
  scoreDisplay.textContent = 'คะแนน: ' + score;
  if(score >= 100){
    img.src = "https://limbuscompany.wiki.gg/images/Don_Quixote_Sprite_7.png?597960";
  } else {
    img.src = "https://limbuscompany.wiki.gg/images/Don_Quixote_Sprite_3.png?eafa96";
  }
}

// Event แบบหักคะแนน
function triggerLoseEvent(){
  isLocked = true;
  overlayText1.textContent = "";
  overlayText2.textContent = "";
  consentBtn.style.display = "none";
  overlay.style.opacity = 1;
  overlay.style.pointerEvents = "auto";

  setTimeout(() => {
    score = Math.max(0, score - 100);
    localStorage.setItem('score', score);
    updateUI();

    overlay.style.opacity = 0;
    setTimeout(()=>{ isLocked = false; overlay.style.pointerEvents="none"; },2000);
  }, 4000);
}

// Event แบบถาม
function triggerQuestionEvent(){
  isLocked = true;
  overlayText1.textContent = "… Thus marks the end of the dreaming.";
  overlayText2.textContent = "Do you have to consent to her presence?";
  consentBtn.style.display = "block";
  overlay.style.opacity = 1;
  overlay.style.pointerEvents = "auto";
}

// กดยินยอม Event 2
consentBtn.addEventListener('click', ()=>{
  img.src = "https://limbuscompany.wiki.gg/images/Don_Quixote_Sancho_Past_Sprite_1.png?dfba03";
  pointsPerClick = 2;
  overlay.style.opacity = 0;
  setTimeout(()=>{ isLocked = false; overlay.style.pointerEvents="none"; },2000);
  consentBtn.style.display = "none";
  overlayText1.textContent = "";
  overlayText2.textContent = "";
});

// กดรูป
img.addEventListener('click', ()=>{
  if(isLocked) return;
  score += pointsPerClick;
  localStorage.setItem('score', score);
  updateUI();
  sound.currentTime = 0;
  sound.play();

  let rand = Math.random();
  if(rand < 0.005){ // 0.5% Event 2
    triggerQuestionEvent();
  } else if(rand < 0.015){ // 1% Event 1
    triggerLoseEvent();
  }
});

// รีเซ็ต
resetBtn.addEventListener('click', ()=>{
  confirmText.textContent = "คุณต้องการรีเซ็ตคะแนนหรือไม่?";
  confirmBox.style.display = "block";
  confirmAction = "reset";
});

yesBtn.addEventListener('click', ()=>{
  if(confirmAction==="reset"){
    score=0;
    pointsPerClick = 1;
  }
  localStorage.setItem('score', score);
  updateUI();
  confirmBox.style.display="none";
});

noBtn.addEventListener('click', ()=>{
  confirmBox.style.display="none";
});
</script>

</body>
</html>
