<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>สุ่มสิ่งมีชีวิตในน้ำแบบ RPG มือถือ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #00bcd4, #e0f7fa);
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  h1 {
    margin-top: 20px;
    color: #006064;
    text-shadow: 1px 1px 2px #000;
    font-size: 24px;
  }

  #creatureBox {
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
    width: 80%;
    max-width: 300px;
    background-color: #ffffff;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    transition: transform 0.5s, box-shadow 0.5s;
    position: relative;
  }

  #creatureEmoji {
    font-size: 80px; /* ขนาดใหญ่พอเหมาะมือถือ */
    margin-bottom: 10px;
    transition: transform 0.5s;
  }

  #creatureName {
    font-size: 20px;
    font-weight: bold;
    transition: color 0.5s, transform 0.5s;
  }

  button {
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    border-radius: 8px;
    background-color: #00acc1;
    color: white;
    border: none;
    box-shadow: 0 4px #00838f;
    transition: 0.2s;
    width: 60%;
    max-width: 250px;
  }

  button:active {
    transform: translateY(4px);
    box-shadow: 0 0 #00838f;
  }

  /* วิบวับสำหรับ SSS */
  @keyframes sparkle {
    0%, 100% { box-shadow: 0 0 15px #e91e63, 0 0 30px #ff80ab, 0 0 45px #f48fb1; }
    50% { box-shadow: 0 0 30px #ff80ab, 0 0 60px #f48fb1, 0 0 90px #e91e63; }
  }

  /* Pop-up กลาง-ล่างจอ */
  #popup {
    position: fixed;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    padding: 30px;
    text-align: center;
    z-index: 1000;
    transition: transform 0.5s, box-shadow 0.5s;
    box-shadow: 0 0 30px #e91e63;
    width: 80%;
    max-width: 300px;
  }

  #popup.show {
    transform: translateX(-50%) scale(1);
    animation: sparkle 1s infinite;
  }

  #popupEmoji {
    font-size: 100px; /* ขยายใหญ่สำหรับ Pop-up */
  }

  #popup h2 {
    font-size: 28px;
    color: #e91e63;
    margin: 15px 0 0;
    text-shadow: 2px 2px 4px #000;
  }
</style>
</head>
<body>

<h1>สุ่มสิ่งมีชีวิตในน้ำ</h1>

<div id="creatureBox">
  <div id="creatureEmoji">❓</div>
  <div id="creatureName">รอดูสิ่งมีชีวิต...</div>
</div>

<button onclick="spawnCreature()">เปิดกล่องสุ่ม!</button>

<!-- Pop-up กลาง-ล่างจอ -->
<div id="popup">
  <div id="popupEmoji">❓</div>
  <h2 id="popupName"></h2>
</div>

<!-- เสียง -->
<audio id="soundCommon" src="https://www.soundjay.com/button/beep-07.wav"></audio>
<audio id="soundUncommon" src="https://www.soundjay.com/button/button-09.wav"></audio>
<audio id="soundRare" src="https://www.soundjay.com/button/button-3.wav"></audio>
<audio id="soundLegend" src="https://www.soundjay.com/button/button-4.wav"></audio>
<audio id="soundSSS" src="https://www.soundjay.com/button/button-10.wav"></audio>

<script>
  const creatures = [
    { name: "ปลาเล็ก", rarity: "ธรรมดา", chance: 45, emoji: "🐟", color: "#4caf50", sound: "soundCommon" },
    { name: "ปลาสีสันสดใส", rarity: "ไม่ธรรมดา", chance: 25, emoji: "🐠", color: "#2196f3", sound: "soundUncommon" },
    { name: "ปลาฉลาม", rarity: "หายาก", chance: 15, emoji: "🦈", color: "#ff9800", sound: "soundRare" },
    { name: "ปลาวาฬ", rarity: "ตำนาน", chance: 14, emoji: "🐋", color: "#9c27b0", sound: "soundLegend" },
    { name: "กุ้ง", rarity: "SSS", chance: 1, emoji: "🦐", color: "#e91e63", sound: "soundSSS" }
  ];

  function spawnCreature() {
    const box = document.getElementById("creatureBox");
    const emoji = document.getElementById("creatureEmoji");
    const name = document.getElementById("creatureName");

    box.style.transform = "scale(1.1)";
    emoji.style.transform = "rotate(15deg)";
    name.style.transform = "scale(1.2)";
    
    setTimeout(() => {
      box.style.transform = "scale(1)";
      emoji.style.transform = "rotate(0deg)";
      name.style.transform = "scale(1)";
    }, 500);

    const rand = Math.random() * 100;
    let total = 0;
    for (let c of creatures) {
      total += c.chance;
      if (rand <= total) {
        name.innerText = `${c.name} (${c.rarity})`;
        name.style.color = c.color;
        emoji.innerText = c.emoji;

        const sound = document.getElementById(c.sound);
        if (sound) { sound.currentTime = 0; sound.play(); }

        // ถ้าเป็น SSS แสดง Pop-up กลาง-ล่าง
        if(c.rarity === "SSS"){
          const popup = document.getElementById("popup");
          document.getElementById("popupEmoji").innerText = c.emoji;
          document.getElementById("popupName").innerText = `${c.name} (${c.rarity})`;
          popup.classList.add("show");
          setTimeout(() => { popup.classList.remove("show"); }, 3000);
        }

        return;
      }
    }
  }
</script>

</body>
</html>
